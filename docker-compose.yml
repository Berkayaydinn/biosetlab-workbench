services: 

  backend:
    build: 
      context: backend
    container_name: backend
    env_file:
      - ./backend/.env
    restart: always
    working_dir: /usr/src/app
    networks: 
      - node-network
    volumes: 
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    tty: true
    ports: 
      - "3838:8000"
    command: node app.js

  frontend:
    build: 
      context: frontend
    container_name: frontend
    restart: always
    working_dir: /usr/src/app
    networks: 
      - node-network
    volumes: 
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    tty: true
    ports: 
      - "5173:5173"
    command: npm run dev

  nginx:
    build: 
      context: nginx
    container_name: nginx
    restart: always
    tty: true
    ports: 
      - "8000:80"
    networks: 
      - node-network
    depends_on:
      - backend
      - frontend

  playground-service:
    build: 
      context: ./playground
    container_name: playground-service
    restart: always
    env_file:
      - ./playground/.env
    working_dir: /app
    volumes:
      - ./playground:/app
    ports: 
      - "3000:3000"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 3000  --reload"
    networks: 
      - node-network

  celery-worker:
    build:
      context: ./playground
    container_name: celery-worker
    restart: always
    env_file:
      - ./playground/.env
    working_dir: /app
    volumes:
      - ./playground:/app
    command: celery -A app.celery worker --loglevel=INFO
    depends_on:
      - rabbitmq
    networks:
      - node-network

  flower:
    build:
      context: ./playground
    container_name: flower
    restart: always
    env_file:
      - ./playground/.env
    working_dir: /app
    volumes:
      - ./playground:/app
    ports:
      - "5555:5555"
    command: celery -A app.celery flower --host=0.0.0.0 --port=5555
    depends_on:
      - rabbitmq
      - celery-worker
    networks:
      - node-network

  rabbitmq:
    image: "rabbitmq:3.12-management"
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: mypass
    networks:
      - node-network
    restart: always

  redis:
    image: "redis:7-alpine"
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - node-network
    restart: always
    command: redis-server --appendonly yes
    
networks: 
  node-network:
    driver: bridge

volumes:
  backend_node_modules:
